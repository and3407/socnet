services:
  nginx:
    image: nginx:alpine
    container_name: socnet_nginx
    ports:
      - "8383:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
#      - mysql
    networks:
      - socnet-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: socnet_php
    volumes:
      - ./:/var/www
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=socnet
      - DB_USER=root
      - DB_PASSWORD=root
#    depends_on:
#      - mysql
    networks:
      - socnet-network

#  mysql:
#    image: mysql:8.0
#    container_name: socnet_mysql
##    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: root
#      MYSQL_DATABASE: socnet
#      MYSQL_PASSWORD: root
#    ports:
#      - "3306:3306"
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - socnet-network

    # Главная база данных (мастер) - пока единственная
  dbmain:
    image: postgres:16-alpine
    container_name: pg-master
    environment:
      POSTGRES_USER: master_user
      POSTGRES_PASSWORD: root
      POSTGRES_DB: socnet
    ports:
      - "5432:5432" # Пробрасываем порт для удобства подключения с хоста
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
      - ./postgres/master-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - socnet-network
    # Пока не трогаем настройки репликации в конфиге
    # command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10"]

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - dbmain
    networks:
      - socnet-network

