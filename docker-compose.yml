  master:
    container_name: "citus_master"
    image: "citusdata/citus:12.1.3"
    ports: ["${COORDINATOR_EXTERNAL_PORT:-5435}:5432"]
    environment: &AUTH
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "admin"
      PGUSER: "${POSTGRES_USER:-postgres}"
      PGPASSWORD: "admin"
      POSTGRES_HOST_AUTH_METHOD: "${POSTGRES_HOST_AUTH_METHOD:-trust}"
    networks:
      - socnet-network
  worker1:
    image: "citusdata/citus:12.1.3"
    container_name: "citus_worker_1"
    environment: *AUTH
    networks:
      - socnet-network
  worker2:
    image: "citusdata/citus:12.1.3"
    container_name: "citus_worker_2"
    environment: *AUTH
    networks:
      - socnet-network

  # --- Новые воркеры ---
  worker3:
    image: "citusdata/citus:12.1.3"
    container_name: "citus_worker_3"
    environment: *AUTH
    networks:
      - socnet-network
  worker4:
    image: "citusdata/citus:12.1.3"
    container_name: "citus_worker_4"
    environment: *AUTH
    networks:
      - socnet-network

volumes:
  postgres-master-data:
  postgres-main-data:
  postgres-slave1-data:
  postgres-slave2-data:
  redis-data:
  citus-volume:

networks:
  socnet-network:
    driver: bridge