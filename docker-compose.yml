services:
  nginx:
    image: nginx:alpine
    container_name: socnet_nginx
    ports:
      - "8383:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
#      - mysql
    networks:
      - socnet-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: socnet_php
    volumes:
      - ./:/var/www
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=socnet
      - DB_USER=root
      - DB_PASSWORD=root
#    depends_on:
#      - mysql
    networks:
      - socnet-network

#  mysql:
#    image: mysql:8.0
#    container_name: socnet_mysql
##    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: root
#      MYSQL_DATABASE: socnet
#      MYSQL_PASSWORD: root
#    ports:
#      - "3306:3306"
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - socnet-network

    # Главная база данных (мастер) - пока единственная
  pgmain:
    image: postgres:17-alpine
    container_name: pgmain
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: zabbix
    ports:
      - "5432:5432"
    volumes:
      - postgres-main-data:/var/lib/postgresql/data
    networks:
      - socnet-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - pgmain
    networks:
      - socnet-network

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - socnet-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: socnet_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - socnet-network

  websocket:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: socnet_websocket
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www
    command: php /var/www/websocket-server.php
    depends_on:
      - redis
      - rabbitmq
    networks:
      - socnet-network

  rabbitmq-consumer:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: socnet_rabbitmq_consumer
    volumes:
      - ./:/var/www
    command: php /var/www/rabbitmq-consumer.php
    depends_on:
      - redis
      - rabbitmq
      - pgmain
    networks:
      - socnet-network

  prometheus:
    image: prom/prometheus:latest
    container_name: socnet_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - socnet-network

  grafana:
    image: grafana/grafana:latest
    container_name: socnet_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - socnet-network

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: socnet_zabbix_server
    ports:
      - "10051:10051"
    environment:
      - DB_SERVER_HOST=pgmain
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=zabbix
      - ZBX_ENABLE_SNMP_TRAPS=false
      - ZBX_START_POLLERS=5
      - ZBX_START_POLLERS_UNREACHABLE=1
      - ZBX_START_DISCOVERERS=1
      - ZBX_START_HTTP_POLLERS=1
      - ZBX_START_ALERTER=1
      - ZBX_CACHESIZE=128M
      - ZBX_HISTORYCACHESIZE=64M
      - ZBX_HISTORYINDEXCACHESIZE=32M
      - ZBX_TRENDCACHESIZE=32M
      - ZBX_VALUECACHESIZE=32M
    depends_on:
      - pgmain
    networks:
      - socnet-network

  zabbix-web:
    image: zabbix/zabbix-web-apache-pgsql:alpine-7.0-latest
    container_name: socnet_zabbix_web
    ports:
      - "8081:8080"
    environment:
      - DB_SERVER_HOST=pgmain
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=zabbix
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=Europe/Moscow
    depends_on:
      - pgmain
      - zabbix-server
    networks:
      - socnet-network

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    container_name: socnet_zabbix_agent
    ports:
      - "10050:10050"
    environment:
      - ZBX_HOSTNAME=socnet_php
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_ACTIVE_ALLOW=true
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /var/run:/var/run:ro
    privileged: true
    depends_on:
      - zabbix-server
    networks:
      - socnet-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: socnet_node_exporter
    ports:
      - "9101:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - socnet-network

