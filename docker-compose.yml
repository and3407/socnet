services:
  nginx:
    image: nginx:alpine
    container_name: socnet_nginx
    ports:
      - "8383:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php1
      - php2
      - php3
#      - mysql
    networks:
      - socnet-network

  php1:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: socnet_php1
    volumes:
      - ./:/var/www
    networks:
      - socnet-network

  php2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: socnet_php2
    volumes:
      - ./:/var/www
    networks:
      - socnet-network

  php3:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: socnet_php3
    volumes:
      - ./:/var/www
    networks:
      - socnet-network

