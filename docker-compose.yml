  pgmaster:
    image: postgres:17-alpine
    container_name: pgmaster
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
      - ./postgres/init-scripts/init-master.sh:/docker-entrypoint-initdb.d/init-master.sh
    networks:
      - socnet-network

  pgslave1:
    image: postgres:17-alpine
    container_name: pgslave1
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres-slave1-data:/var/lib/postgresql/data
      - ./postgres/init-scripts/init-slave.sh:/docker-entrypoint-initdb.d/init-slave.sh
    depends_on:
      - pgmaster
    networks:
      - socnet-network

  pgslave2:
    image: postgres:17-alpine
    container_name: pgslave2
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres-slave2-data:/var/lib/postgresql/data
      - ./postgres/init-scripts/init-slave.sh:/docker-entrypoint-initdb.d/init-slave.sh
    depends_on:
      - pgmaster
    networks:
      - socnet-network

  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy
    ports:
      - "5433:5433"
      - "1936:1936"
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - pgslave1
      - pgslave2
    networks:
      - socnet-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - pgmaster
    networks:
      - socnet-network

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - socnet-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: socnet_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - socnet-network

