services:
  nginx:
    image: nginx:alpine
    container_name: socnet_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - mysql
    networks:
      - socnet-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: socnet_php
    volumes:
      - ./:/var/www
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=socnet
      - DB_USER=root
      - DB_PASSWORD=root
    depends_on:
      - mysql
    networks:
      - socnet-network

  mysql:
    image: mysql:8.0
    container_name: socnet_mysql
#    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: socnet
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - socnet-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: socnet_phpmyadmin
#    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - socnet-network

volumes:
  mysql_data:

networks:
  socnet-network:
    driver: bridge