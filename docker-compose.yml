services:
  nginx:
    image: nginx:alpine
    container_name: socnet_nginx
    ports:
      - "8383:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
#      - mysql
    networks:
      - socnet-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: socnet_php
    volumes:
      - ./:/var/www
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=socnet
      - DB_USER=root
      - DB_PASSWORD=root
#    depends_on:
#      - mysql
    networks:
      - socnet-network

#  mysql:
#    image: mysql:8.0
